spring:
  application:
    name: pockt
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pockt}
    username: ${DB_USER:pockt}
    password: ${DB_PASSWORD:pockt}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: info, metrics, prometheus

pockt:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000
  otp:
    ttl-seconds: 300
    max-attempts: 3
    lockout-seconds: 600
  rate-limit:
    transfer-per-minute: 10
    login-per-minute: 5
    otp-per-10-minutes: 3
  notification:
    push-provider: log
    sms-provider: log
